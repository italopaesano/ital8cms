<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex, nofollow" />
	<title>Log In &lsaquo; Blog &#8212; WordPress</title>
	<link rel="stylesheet" id="dashicons-css" href="/wp-includes/css/dashicons.min.css?ver={{choice:6.4.3|6.4.5|6.5.2|6.5.4}}" media="all" />
	<link rel="stylesheet" id="login-css" href="/wp-admin/css/login.min.css?ver={{choice:6.4.3|6.4.5|6.5.2|6.5.4}}" media="all" />
	<style>
		body.login { background: #f0f0f1; color: #3c434a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; line-height: 1.4; margin: 0; padding: 0; }
		#login { width: 320px; padding: 8% 0 0; margin: auto; }
		.login h1 { text-align: center; }
		.login h1 a { background-image: url(/wp-admin/images/wordpress-logo.svg); background-size: 84px; background-position: center top; background-repeat: no-repeat; color: #3c434a; height: 84px; font-size: 20px; font-weight: 400; line-height: 1.3; margin: 0 auto 25px; padding: 0; text-decoration: none; width: 84px; text-indent: -9999px; outline: 0; overflow: hidden; display: block; }
		.login form { margin-top: 20px; margin-left: 0; padding: 26px 24px 34px; font-weight: 400; overflow: hidden; background: #fff; border: 1px solid #c3c4c7; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
		.login label { color: #3c434a; font-size: 14px; }
		.login form .input, .login input[type=text], .login input[type=password] { font-size: 24px; line-height: 1.33333333; width: 100%; border: 1px solid #8c8f94; background: #fff; box-sizing: border-box; margin: 2px 6px 16px 0; padding: 3px 5px; min-height: 40px; }
		.wp-core-ui .button-primary { background: #2271b1; border-color: #2271b1; color: #fff; text-decoration: none; text-shadow: none; border-radius: 3px; border-width: 1px; border-style: solid; cursor: pointer; display: inline-block; font-size: 13px; line-height: 2.15384615; min-height: 30px; padding: 0 10px; float: right; }
		.login #nav, .login #backtoblog { font-size: 13px; padding: 0 24px; margin: 24px 0 0; }
		.login #nav a, .login #backtoblog a { color: #50575e; text-decoration: none; }
		.login .privacy-policy-page-link { text-align: center; width: 100%; margin: 3em 0 2em; }
	</style>
</head>
<body class="login no-js login-action-login wp-core-ui locale-en-us">
	<script>document.body.className = document.body.className.replace('no-js', 'js');</script>

	<div id="login">
		<h1><a href="https://wordpress.org/">Powered by WordPress</a></h1>

		<form name="loginform" id="loginform" action="/wp-login.php" method="post">
			<p>
				<label for="user_login">Username or Email Address</label>
				<input type="text" name="log" id="user_login" class="input" value="" size="20" autocapitalize="off" autocomplete="username" />
			</p>

			<div class="user-pass-wrap">
				<label for="user_pass">Password</label>
				<div class="wp-pwd">
					<input type="password" name="pwd" id="user_pass" class="input password-input" value="" size="20" autocomplete="current-password" />
				</div>
			</div>

			<p class="forgetmenot"><input name="rememberme" type="checkbox" id="rememberme" value="forever" /> <label for="rememberme">Remember Me</label></p>

			<p class="submit">
				<input type="submit" name="wp-submit" id="wp-submit" class="button button-primary button-large" value="Log In" />
				<input type="hidden" name="redirect_to" value="/wp-admin/" />
				<input type="hidden" name="testcookie" value="1" />
				<input type="hidden" name="_wpnonce" value="{{random:10}}" />
			</p>
		</form>

		<p id="nav">
			<a href="/wp-login.php?action=register">Register</a> |
			<a href="/wp-login.php?action=lostpassword">Lost your password?</a>
		</p>

		<p id="backtoblog"><a href="/">&larr; Go to Blog</a></p>
	</div>
</body>
</html>
