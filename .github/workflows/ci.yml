# CI workflow — two responsibilities:
#   1. `test`  — full test suite (Jest unit + integration, Playwright E2E) on every
#                pull request and push to main, across the active Node.js LTS lines
#                (22 "Jod", 24 "Krypton").
#   2. `audit` — dependency vulnerability audit (npm audit), also on a weekly cron so
#                newly disclosed advisories on already-installed deps are surfaced.
#   3. `coverage` — anti-regression ratchet on test coverage. Runs once, on a single
#                Node line: the percentages are identical to the line on 22 and 24
#                (measured: 10058/19297 statements on both), so running it inside the
#                matrix would compute the same number twice.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Weekly dependency audit — Mondays 06:00 UTC. Catches advisories disclosed
    # against dependencies that are already pinned in the lockfile (a PR-only run
    # would miss those). On schedule events only the `audit` job runs.
    - cron: '0 6 * * 1'

# Cancel superseded runs on the same ref (e.g. new pushes to a PR) to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    # The scheduled cron run only needs the audit job, not the full test matrix.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Run every Node.js version even if one fails, so we get full feedback.
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The `npm test` script also runs the Playwright E2E suite, which needs a
      # browser binary plus its OS-level libraries — installed here with --with-deps.
      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      # Runs scripts/checkNixShell.js (no-op on non-Nix CI) → Jest → Playwright.
      - name: Run test suite
        run: npm test

  coverage:
    name: Coverage ratchet
    # Come il test matrix: sul cron settimanale serve solo l'audit.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Una sola versione di Node, di proposito. La copertura misura QUALI righe
      # vengono eseguite, non come: 22 e 24 producono numeri identici alla riga,
      # quindi eseguirlo due volte costerebbe minuti senza aggiungere informazione.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `test:coverage` è jest da solo — niente Playwright, che non contribuisce
      # alla copertura misurata da `collectCoverageFrom` e raddoppierebbe i tempi.
      #
      # La soglia vive in `tests/jest.config.js` (`coverageThreshold`), non qui: così
      # vale anche in locale, e un `npm run test:coverage` sulla macchina di chi
      # sviluppa dà lo stesso verdetto della CI invece di scoprirlo dopo il push.
      #
      # Questo job fallisce SOLO per la soglia o per un test rotto, e il check si
      # chiama « Coverage ratchet »: chi guarda la lista dei check capisce quale
      # delle due cose è successa senza aprire il log.
      #
      # ⚠ Nessuna rete verso GitHub è garantita qui: i 5 test di
      # `themesInstall.realRepo` si saltano da soli quando i repo remoti non sono
      # raggiungibili. È il caso da cui la soglia è stata misurata — il PAVIMENTO —
      # quindi una run connessa può solo alzare il numero, mai abbassarlo.
      - name: Run test suite with coverage (fails below threshold)
        run: npm run test:coverage

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Report-only (continue-on-error): surfaces known advisories in the job log
      # without failing the check, so pull requests on this alpha project are never
      # blocked by a dependency finding. The real-time notification path is
      # Dependabot alerts (enabled in the repo's Settings → Code security).
      - name: Audit dependencies (report only)
        continue-on-error: true
        run: npm audit
